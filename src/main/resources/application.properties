spring.application.name=IntBuddy


# ===============================
# MYSQL DATABASE CONFIGURATION
# ===============================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}



# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



# ===============================
# GROQ AI CONFIGURATION
# ===============================

groq.api.key=${GROQ_API_KEY}

groq.url=${GROQ_URL}

# llama-3.1-8b-instant was shut down by Groq on 2026-08-16; override with GROQ_MODEL
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}



# ===============================
# SERVER
# ===============================

server.port=${SERVER_PORT:8080}

# Return the exception message in error responses instead of hiding it
server.error.include-message=always

# Running behind the Nginx reverse proxy
server.forward-headers-strategy=framework

# Comma-separated list of allowed browser origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}



# ===============================
# REDIS CONFIGURATION
# ===============================

spring.data.redis.host=${SPRING_REDIS_HOST:intbuddy-redis}

spring.data.redis.port=${SPRING_REDIS_PORT:6379}

spring.cache.type=redis



# ===============================
# EMAIL CONFIGURATION
# ===============================

spring.mail.host=${SPRING_MAIL_HOST}

spring.mail.port=${SPRING_MAIL_PORT}

spring.mail.username=${SPRING_MAIL_USERNAME}

spring.mail.password=${SPRING_MAIL_PASSWORD}


spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true



# ===============================
# FILE UPLOAD
# ===============================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB



# ===============================
# TWILIO CONFIGURATION
# ===============================

twilio.accountSid=${TWILIO_ACCOUNTSID}

twilio.authToken=${TWILIO_AUTHTOKEN}

twilio.phoneNumber=${TWILIO_PHONENUMBER}