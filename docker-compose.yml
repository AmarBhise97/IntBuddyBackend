services:

  backend:

    image: amarbhise/intbuddy-backend:latest

    container_name: intbuddy-backend

    restart: unless-stopped


    env_file:
      - /opt/intbuddy/env/backend.env

    # Cap the JVM so it doesn't starve MySQL on a small instance
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m -Xss512k"


    expose:
      - "8080"


    networks:
      - intbuddy-network



networks:

  intbuddy-network:

    external: true
